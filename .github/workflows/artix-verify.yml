name: Artix RootFS Verify

# Standalone verification workflow: rebuilds only the three Artix (OpenRC)
# templates that previously failed due to the dead armtixlinux.org mirror.
# Does NOT create releases or touch rootfs.json. Trigger manually.

on:
  workflow_dispatch:

concurrency:
  group: artix-verify
  cancel-in-progress: false

jobs:
  build:
    name: aarch64/${{ matrix.name }}
    runs-on: ubuntu-24.04-arm
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Artix-Base-OpenRC
          - name: Artix-Minimal-OpenRC
          - name: Artix-bspwm-OpenRC
    steps:
      - uses: actions/checkout@v4

      - name: Verify Armtix tarball source is reachable
        run: |
          URL=$(grep -oE 'https://[^ ]+\.tar\.xz' "templates/aarch64/${{ matrix.name }}.Dockerfile" | head -1)
          echo "Source URL: $URL"
          UA="Mozilla/5.0 (X11; Linux x86_64) Droidspaces-CI/1.0"
          # HEAD can be blocked by Cloudflare (403) for datacenter IPs; fall back
          # to a small ranged GET, which mirrors what the real build does.
          CODE=$(curl -sSI -A "$UA" --max-time 30 -o /dev/null -w '%{http_code}' "$URL" || true)
          echo "HEAD probe: $CODE"
          if [ "$CODE" != "200" ]; then
            CODE=$(curl -sSL -A "$UA" --max-time 60 -r 0-1048575 -o /dev/null -w '%{http_code}' "$URL" || true)
            echo "GET range probe: $CODE"
          fi
          case "$CODE" in 200|206) echo "Source reachable";; *) echo "::error::source unreachable (last code: $CODE)"; exit 1;; esac

      - name: Build rootfs
        run: ./build.sh -a "aarch64" -i "${{ matrix.name }}" -v "verify-$(date +'%Y%m%d-%H%M%S')"

      - uses: actions/upload-artifact@v4
        with:
          name: verify-aarch64-${{ matrix.name }}
          path: "*.tar.xz"
          retention-days: 1
          if-no-files-found: error
